[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "audit-platform"
version = "0.1.0"
description = "Modular SEO/PPC audit platform with multi-API connectors"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "httpx>=0.25",
    "google-ads>=24.0.0",
    "google-analytics-data>=0.18.0",
    "google-auth>=2.0",
    "google-auth-oauthlib>=1.0",
    "google-api-python-client>=2.0",
    "tenacity>=8.0",
    "structlog>=23.0",
    "networkx>=2.6",
    "vaderSentiment>=3.3.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "pre-commit>=3.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/audit_platform"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
